# Runs the data checks and tests on every pull request and on pushes to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the change list compares the data with an earlier commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the scripts parse
        run: for f in app.js insights.js rigs.js changes.js basemap.js theme-init.js; do node --check "$f"; done
      - name: Asset versions match the files
        run: node scripts/stamp-assets.js --check
      - name: Change list matches the data
        run: node scripts/build-changes.js --check
      - name: Validate rig data
        run: node scripts/validate.js
      - name: Date logic
        run: node scripts/test-dates.js
      - name: Filters
        run: node scripts/test-filters.js
      - name: Insights calculations
        run: node scripts/test-insights.js
      - name: Accessibility (axe-core in the runner's Chrome)
        run: |
          npm install --no-save --no-package-lock --silent axe-core@4.13.0
          node scripts/test-a11y.js
